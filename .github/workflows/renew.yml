name: Katabump Auto Renew

on:
  schedule:
    # 每天 UTC 0点 (北京时间 8点) 运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发
    inputs:
      chrome_version:
        description: '可选：指定 Chrome 版本 (如 stable / 完整版本号)。留空则使用 runner 自带的 Chrome'
        required: false
        default: ''

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb curl jq

    # 仅在手动触发并填写了 chrome_version 时才安装指定版本的 Chrome，
    # 用于排查"runner 自带 Chrome 更新后导致 CF 验证失败"的情况
    - name: Setup Chrome (optional, pinned)
      id: setup_chrome
      if: ${{ github.event.inputs.chrome_version != '' }}
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: ${{ github.event.inputs.chrome_version }}

    - name: Install Project Dependencies
      # 若仓库里提交了 package-lock.json，则用 npm ci 锁定依赖版本；否则退回 npm install
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          echo "⚠️ 未发现 package-lock.json，依赖版本会浮动，建议提交 lock 文件"
          npm install
        fi

    - name: Setup and Run Xray (Robust VLESS to Socks5)
      env:
        HTTP_PROXY_RAW: ${{ secrets.HTTP_PROXY }}
      run: |
        echo "正在下载并安装 Xray-core..."
        curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/download/v25.9.11/Xray-linux-64.zip
        unzip -q xray.zip -d xray-bin
        chmod +x ./xray-bin/xray

        echo "正在使用 Node.js 精准解析 VLESS 并生成配置..."
        node -e '
        try {
          const raw = process.env.HTTP_PROXY_RAW;
          if (!raw) throw new Error("未检测到 HTTP_PROXY 变量");

          const urlObj = new URL(raw);
          const uuid = decodeURIComponent(urlObj.username);
          // 兼容 IPv6 地址（形如 [::1]）
          const server = urlObj.hostname.replace(/^\[|\]$/g, "");
          const port = parseInt(urlObj.port);
          if (!uuid || !server || !port) throw new Error("VLESS 链接缺少必要字段 (uuid/server/port)");

          const params = urlObj.searchParams;

          // 传输层协议，默认为 tcp（原始 VLESS 标准默认值）
          const network = (params.get("type") || "tcp").toLowerCase();

          // 安全层，默认为 none
          const security = (params.get("security") || "none").toLowerCase();

          // sni 优先，其次 host，最后回退到服务器地址本身
          const sni = params.get("sni") || params.get("host") || server;

          // TLS 指纹，默认 chrome，兼容 fp 参数
          const fp = params.get("fp") || "chrome";

          // insecure / allowInsecure 两种参数名都兼容，值为 "1"/"true" 时代表跳过证书校验
          const insecureRaw = (params.get("allowInsecure") || params.get("insecure") || "0").toLowerCase();
          const allowInsecure = (insecureRaw === "1" || insecureRaw === "true");

          // ws / http 传输用到的 host 头
          const hostHeader = params.get("host") || "";

          // path 参数，自动补齐前导 / 并做 URL 解码
          let pathStr = params.get("path") || "/";
          pathStr = decodeURIComponent(pathStr);
          if (!pathStr.startsWith("/")) pathStr = "/" + pathStr;

          // tcp 伪装类型：none（原始 TCP）或 http（HTTP 伪装）
          const headerType = (params.get("headerType") || "none").toLowerCase();

          const streamSettings = {
            "network": network,
            "security": security
          };

          if (security === "tls") {
            streamSettings.tlsSettings = {
              "serverName": sni,
              "allowInsecure": allowInsecure,
              "fingerprint": fp
            };
          } else if (security === "reality") {
            streamSettings.realitySettings = {
              "serverName": sni,
              "fingerprint": fp,
              "publicKey": params.get("pbk") || "",
              "shortId": params.get("sid") || "",
              "spiderX": params.get("spx") || ""
            };
          }

          if (network === "ws") {
            streamSettings.wsSettings = {
              "path": pathStr,
              "headers": hostHeader ? { "Host": hostHeader } : {}
            };
          } else if (network === "tcp") {
            streamSettings.tcpSettings = {
              "header": { "type": headerType }
            };
          } else if (network === "grpc") {
            streamSettings.grpcSettings = {
              "serviceName": params.get("serviceName") || pathStr.replace(/^\//, "")
            };
          } else if (network === "http" || network === "h2") {
            streamSettings.network = "http";
            streamSettings.httpSettings = {
              "path": pathStr,
              "host": hostHeader ? [hostHeader] : []
            };
          }

          const config = {
            "log": { "loglevel": "warning" },
            "inbounds": [
              {
                "port": 10808,
                "protocol": "socks",
                "settings": { "auth": "noauth", "udp": true }
              }
            ],
            "outbounds": [
              {
                "protocol": "vless",
                "settings": {
                  "vnext": [
                    {
                      "address": server,
                      "port": port,
                      "users": [
                        { "id": uuid, "encryption": "none", "level": 0 }
                      ]
                    }
                  ]
                },
                "streamSettings": streamSettings
              }
            ]
          };

          require("fs").writeFileSync("config.json", JSON.stringify(config, null, 2));
          console.log("✅ config.json 配置文件生成成功！(network=" + network + ", security=" + security + ")");
        } catch (e) {
          console.error("❌ 解析 VLESS 失败:", e.message);
          process.exit(1);
        }
        '

        echo "正在后台启动 Xray 代理服务..."
        ./xray-bin/xray -config config.json > xray.log 2>&1 &

        echo "等待代理通道建立..."
        sleep 5

        echo "=== 正在检查本地 10808 端口占用情况 ==="
        ss -lntp | grep 10808 || echo "警告: 10808 端口似乎没有被监听！"

        echo "=== 尝试打印 Xray 运行日志 ==="
        cat xray.log || true

        echo "=== 校验代理是否真正可用 ==="
        if ! ss -lntp | grep -q 10808; then
          echo "❌ Xray 未能监听 10808 端口，代理未启动成功，终止工作流。"
          exit 1
        fi
        if ! curl -s --max-time 10 -x socks5h://127.0.0.1:10808 -o /dev/null -w "%{http_code}" https://www.google.com | grep -q "200\|301\|302"; then
          echo "❌ 代理无法正常访问外网，请检查 HTTP_PROXY 密钥中的 VLESS 节点是否有效。"
          exit 1
        fi
        echo "✅ 代理连通性检测通过！"

    # 打印环境信息(不输出具体 IP)，以后出问题可以和成功那天的日志对比
    - name: Diagnostics (proxy exit & versions)
      env:
        CHROME_PATH: ${{ steps.setup_chrome.outputs.chrome-path }}
      run: |
        echo "--- 代理出口信息 (已隐去 IP) ---"
        curl -s --max-time 15 -x socks5h://127.0.0.1:10808 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(loc|colo|http|tls|warp)=' || echo "获取失败"
        echo "--- Chrome 版本 ---"
        "${CHROME_PATH:-google-chrome}" --version || true
        echo "--- Node / 依赖版本 ---"
        node -v
        npm ls puppeteer-real-browser || true

    - name: Run Renew Script
      env:
        USERS_JSON: ${{ secrets.USERS_JSON }}
        SERVER_URL: ${{ secrets.SERVER_URL }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        HTTP_PROXY: "socks5://127.0.0.1:10808"
        CHROME_PATH: ${{ steps.setup_chrome.outputs.chrome-path }}
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node action_renew.js

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: screenshots/
        if-no-files-found: ignore
