name: Katabump Auto Renew

on:
  schedule:
    # 每天 UTC 0点 (北京时间 8点) 运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  renew:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb curl jq
        
    - name: Install Project Dependencies
      run: |
        npm install
        npx playwright install chromium
        npx playwright install-deps chrome

    - name: Setup and Run Xray (Robust VLESS to Socks5)
      env:
        HTTP_PROXY_RAW: ${{ secrets.HTTP_PROXY }}
      run: |
        echo "正在下载并安装 Xray-core..."
        # 修复点1: 锁定为已验证可用的稳定版本，不再使用 latest，
        # 避免官方发布破坏性更新（如本次移除 allowInsecure）导致工作流突然失败。
        curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/download/v25.9.11/Xray-linux-64.zip
        unzip -q xray.zip -d xray-bin
        chmod +x ./xray-bin/xray
        
        echo "正在使用 Node.js 精准解析 VLESS 并生成配置..."
        node -e '
        try {
          const raw = process.env.HTTP_PROXY_RAW;
          if (!raw) throw new Error("未检测到 HTTP_PROXY 变量");
          
          // 解析 vless:// 开头的链接
          const urlObj = new URL(raw);
          const uuid = urlObj.username;
          const server = urlObj.hostname;
          const port = parseInt(urlObj.port);
          
          const params = urlObj.searchParams;
          const sni = params.get("sni") || "";
          const host = params.get("host") || "";
          let pathStr = params.get("path") || "/";
          if (!pathStr.startsWith("/")) pathStr = "/" + pathStr;

          const config = {
            "log": { "loglevel": "warning" },
            "inbounds": [
              {
                "port": 10808,
                "protocol": "socks",
                "settings": { "auth": "noauth", "udp": true }
              }
            ],
            "outbounds": [
              {
                "protocol": "vless",
                "settings": {
                  "vnext": [
                    {
                      "address": server,
                      "port": port,
                      "users": [
                        { "id": uuid, "encryption": "none", "level": 0 }
                      ]
                    }
                  ]
                },
                "streamSettings": {
                  "network": "ws",
                  "security": "tls",
                  "tlsSettings": {
                    "serverName": sni
                  },
                  "wsSettings": {
                    "path": pathStr,
                    "headers": { "Host": host }
                  }
                }
              }
            ]
          };

          require("fs").writeFileSync("config.json", JSON.stringify(config, null, 2));
          console.log("✅ config.json 配置文件生成成功！");
        } catch (e) {
          console.error("❌ 解析 VLESS 失败:", e.message);
          process.exit(1);
        }
        '

        echo "正在后台启动 Xray 代理服务..."
        ./xray-bin/xray -config config.json > xray.log 2>&1 &
        
        echo "等待代理通道建立..."
        sleep 5
        
        echo "=== 正在检查本地 10808 端口占用情况 ==="
        ss -lntp | grep 10808 || echo "警告: 10808 端口似乎没有被监听！"
        
        echo "=== 尝试打印 Xray 运行日志 (排查异常) ==="
        cat xray.log || true

        echo "=== 校验代理是否真正可用 (关键防呆) ==="
        # 修复点2: 增加代理连通性自检，如果 Xray 没有正常监听或代理不可用，
        # 直接让工作流在这一步失败并给出明确提示，而不是让后面的 Playwright
        # 报出难以理解的 ERR_PROXY_CONNECTION_FAILED。
        if ! ss -lntp | grep -q 10808; then
          echo "❌ Xray 未能监听 10808 端口，代理未启动成功，终止工作流。"
          exit 1
        fi
        if ! curl -s --max-time 10 -x socks5://127.0.0.1:10808 -o /dev/null -w "%{http_code}" https://www.google.com | grep -q "200\|301\|302"; then
          echo "❌ 代理无法正常访问外网，请检查 HTTP_PROXY 密钥中的 VLESS 节点是否有效。"
          exit 1
        fi
        echo "✅ 代理连通性检测通过！"

    - name: Run Renew Script
      env:
        USERS_JSON: ${{ secrets.USERS_JSON }}
        SERVER_URL: ${{ secrets.SERVER_URL }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        HTTP_PROXY: "socks5://127.0.0.1:10808"
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node action_renew.js

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: screenshots/
